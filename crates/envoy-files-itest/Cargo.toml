[package]
name = "envoy-files-itest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Integration tests that drive a real Envoy loading the module. The harness is
# a library; the actual tests live in tests/. Nothing here is built by a plain
# `cargo build` of the module, so these heavy deps stay out of the shipping
# artifact.
[dependencies]
serde_json = "1"
# No gzip feature: we must see the raw precompressed bytes the module serves,
# not have ureq transparently decompress them.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
