[package]
name = "envoy-files-module"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Envoy dynamic module. The filter itself lives in envoy-files-filter so it
# can also be linked into other dynamic modules.
[lib]
crate-type = ["cdylib"]
name = "envoy_files"
path = "src/lib.rs"

[dependencies]
envoy-proxy-dynamic-modules-rust-sdk.workspace = true
envoy-files-filter.workspace = true
