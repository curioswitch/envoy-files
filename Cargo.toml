[workspace]
resolver = "2"
members = [
  "crates/envoy-files-core",
  "crates/envoy-files-filter",
  "crates/envoy-files-io",
  "crates/envoy-files-itest",
  "crates/envoy-files-module",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/curioswitch/envoy-files"
license = "Apache-2.0"

[workspace.dependencies]
crossbeam-channel = "0.5.15"
envoy-files-core = { path = "crates/envoy-files-core" }
envoy-files-filter = { path = "crates/envoy-files-filter" }
envoy-files-io = { path = "crates/envoy-files-io" }
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", tag = "v1.40.0" }
yaml-rust2 = "0.11.0"

[profile.release]
lto = "thin"
